<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema de Casos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        --bg-main: #f3efe3;
        --bg-card: #f8dcdc;
        --border-color: #2b281f;
        --text-main: #2b2621;
        --text-muted: #6b6155;
        --accent-dark: #422411;
        --accent-hover: #53280d;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        background-color: var(--bg-main);
        color: var(--text-main);
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #efece4;
      }
      ::-webkit-scrollbar-thumb {
        background: #c8bead;
        border-radius: 3px;
      }
      @media print {
        aside {
          display: none !important;
        }
        body,
        main {
          overflow: visible !important;
          height: auto !important;
          background-color: white !important;
        }
        .no-print {
          display: none !important;
        }
        input,
        select {
          border: none !important;
          background: transparent !important;
          color: black !important;
        }
        textarea {
          border: none !important;
          background: transparent !important;
          resize: none !important;
          color: black !important;
          height: max-content !important;
          overflow: visible !important;
          white-space: pre-wrap !important;
        }
        .shadow-sm {
          box-shadow: none !important;
          border: 1px solid #ccc !important;
        }
      }
    </style>
  </head>
  <body class="h-screen flex overflow-hidden">
    <!-- BARRA LATERAL -->
    <aside class="w-72 bg-[#f4f0e6] border-r border-[#e3decb] flex flex-col shrink-0">
      <div class="p-3 space-y-1.5 border-b border-[#e3decb]">
        <button
          onclick="selectView('HOME')"
          id="btnHome"
          class="w-full text-left px-3 py-2.5 rounded text-sm font-medium transition"
        >
          Registrar
        </button>
        <button
          onclick="selectView('ALL_PENDING')"
          id="btnAllPending"
          class="w-full text-left px-3 py-2.5 rounded text-sm font-medium flex items-center justify-between transition"
        >
          <span>A fazer</span>
          <span
            id="totalPendingBadge"
            class="bg-amber-100 text-amber-800 border border-amber-300 px-2 py-0.5 rounded text-xs font-semibold"
            >0</span
          >
        </button>
        <button
          onclick="selectView('ALL_HISTORY')"
          id="btnAllHistory"
          class="w-full text-left px-3 py-2.5 rounded text-sm font-medium transition"
        >
          Histórico
        </button>
      </div>

      <div class="px-3 pt-3 pb-1 text-xs font-semibold uppercase tracking-wider text-[#6b6155]">
        Clientes
      </div>
      <div id="clientTree" class="flex-1 overflow-y-auto px-2 pb-4 space-y-1"></div>
    </aside>

    <!-- ÁREA PRINCIPAL -->
    <!-- ADD THIS JUST BEFORE </main> -->
    <button
      id="globalMicBtn"
      title="Ditar texto (Clique em um campo primeiro)"
      class="fixed bottom-6 right-6 z-50 p-4 rounded-full shadow-lg bg-[#3b2d24] text-white hover:bg-[#4f3d32] transition flex items-center justify-center"
    >
      🎤
    </button>
    <main id="mainContent" class="flex-1 overflow-y-auto p-6 md:p-8"></main>

    <script>
      const STORAGE_KEY = "sistema_juridico_minimal_v4";

      function loadState() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) return JSON.parse(saved);
        return { clients: {} };
      }

      let state = loadState();
      let currentView = "HOME"; // 'HOME' | 'ALL_PENDING' | 'CLIENT'
      let activeClient = null;
      let activeSubfolder = null; // null = cliente direto (sem subpastas) ou 'GERAL' (consolidado quando há subpastas) ou nome da subpasta
      let expandedClients = {};
      let homeTab = "TAREFA"; // 'TAREFA' | 'HISTORICO' | 'ARQUIVO' | 'CLIENTE'
      let showNewSubfolderInput = false;

      let draggedClientName = null;

      function getClientOrder() {
        let order = state.clientOrder || [];
        const current = Object.keys(state.clients);
        current.forEach((c) => {
          if (!order.includes(c)) order.push(c);
        });
        order = order.filter((c) => current.includes(c));
        state.clientOrder = order;
        return order;
      }

      function toggleSubfolderComplete(cName, sfName) {
        const sf = state.clients[cName].subfolders[sfName];
        sf.status = sf.status === "COMPLETO" ? "ATIVO" : "COMPLETO";
        saveState();
        renderSidebar();
        renderMain();
      }

      function removeSubfolder(cName, sfName) {
        if (
          confirm(`Tem certeza que deseja apagar a subpasta "${sfName}" e todo o seu conteúdo?`)
        ) {
          delete state.clients[cName].subfolders[sfName];
          activeSubfolder = "GERAL";
          saveState();
          renderSidebar();
          renderMain();
        }
      }

      function onDragStartClient(e, cName) {
        draggedClientName = cName;
      }
      function onDragOverClient(e) {
        e.preventDefault();
      }
      function onDropClient(e, targetClientName) {
        e.preventDefault();
        if (!draggedClientName || draggedClientName === targetClientName) return;
        const order = getClientOrder();
        const fromIdx = order.indexOf(draggedClientName);
        const toIdx = order.indexOf(targetClientName);
        order.splice(fromIdx, 1);
        order.splice(toIdx, 0, draggedClientName);
        state.clientOrder = order;
        saveState();
        renderSidebar();
      }

      function saveState() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        renderSidebar();
      }

      function exportData() {
        const dataStr = JSON.stringify(state, null, 2);
        const blob = new Blob([dataStr], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "backup_sistema.json";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

      function importData(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (e) {
          try {
            const importedState = JSON.parse(e.target.result);
            if (importedState && importedState.clients) {
              state = importedState;
              saveState();
              renderMain();
              alert("Dados JSON carregados com sucesso!");
            } else {
              alert("Arquivo JSON inválido para o sistema.");
            }
          } catch (err) {
            alert("Erro ao ler o arquivo JSON.");
          }
        };
        reader.readAsText(file);
        event.target.value = "";
      }

      function todayBR() {
        const d = new Date();
        return `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}/${d.getFullYear()}`;
      }

      function todayISO() {
        return todayBR().split("/").reverse().join("-");
      }

      function isoToBR(iso) {
        return iso.split("-").reverse().join("/");
      }

      function dmyKey(d) {
        const [dd, mm, yy] = d.split("/");
        return yy + mm + dd;
      }

      function doneDate(ev) {
        return ev.doneDate || ev.date;
      }

      function doneLabel(ev) {
        if (!ev.doneDate) return ev.date;
        return `Concluído em ${ev.doneDate} <span class="font-normal">(criada em ${ev.date})</span>`;
      }

      function money(v) {
        return Number(v).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
      }

      function sortByDeadline(items) {
        return [...items].sort((a, b) => {
          if (a.deadline && b.deadline) return a.deadline.localeCompare(b.deadline);
          if (a.deadline) return -1;
          if (b.deadline) return 1;
          return 0;
        });
      }

      function deadlineInput(cName, ev) {
        const late = ev.deadline && ev.deadline < todayISO();
        return `
        <label class="text-[11px] font-semibold ${late ? "text-[#9b2c2c]" : "text-[#6b6155]"}">Prazo:
          <input type="date" value="${ev.deadline || ""}"
            onchange="setDeadline('${cName}', '${ev._origin || ""}', '${ev.id}', this.value)"
            class="text-[11px] px-1.5 py-0.5 rounded border ${late ? "border-[#f5c6c6] text-[#9b2c2c]" : "border-[#d6cebc] text-[#2b2621]"} bg-white" />
        </label>
      `;
      }

      function isPendingStatus(status) {
        return ["A FAZER", "EM ESPERA", "EM ANDAMENTO"].includes((status || "").toUpperCase());
      }

      function hasSubfolders(clientObj) {
        return clientObj && clientObj.subfolders && Object.keys(clientObj.subfolders).length > 0;
      }

      function getConsolidatedClientData(clientObj) {
        const allEvents = [];
        const allFiles = [];

        (clientObj.events || []).forEach((ev) => {
          allEvents.push({ ...ev, _origin: null });
        });
        (clientObj.files || []).forEach((f, idx) => {
          allFiles.push({ ...f, _origin: null, _idx: idx });
        });

        Object.keys(clientObj.subfolders || {}).forEach((sfName) => {
          const sf = clientObj.subfolders[sfName];
          (sf.events || []).forEach((ev) => {
            allEvents.push({ ...ev, _origin: sfName });
          });
          (sf.files || []).forEach((f, idx) => {
            allFiles.push({ ...f, _origin: sfName, _idx: idx });
          });
        });

        return { events: allEvents, files: allFiles };
      }

      function statusBadgeStyle(status) {
        const s = (status || "").toUpperCase();
        if (s === "A FAZER") return "bg-[#fae8e8] text-[#9b2c2c] border-[#f5c6c6]";
        if (s === "EM ESPERA") return "bg-[#fef3c7] text-[#92400e] border-[#fde68a]";
        if (s === "EM ANDAMENTO") return "bg-[#e0f2fe] text-[#0369a1] border-[#bae6fd]";
        return "bg-[#d1fae5] text-[#065f46] border-[#a7f3d0]";
      }

      function renderSidebar() {
        const tree = document.getElementById("clientTree");
        tree.innerHTML = "";

        let totalPending = 0;
        Object.values(state.clients).forEach((cl) => {
          const consolidated = getConsolidatedClientData(cl);
          consolidated.events.forEach((ev) => {
            if (isPendingStatus(ev.status)) totalPending++;
          });
        });
        document.getElementById("totalPendingBadge").textContent = totalPending;

        const btnHome = document.getElementById("btnHome");
        btnHome.className =
          currentView === "HOME"
            ? "w-full text-left px-3 py-2 rounded text-sm font-semibold bg-[#3b2d24] text-white"
            : "w-full text-left px-3 py-2 rounded text-sm font-medium text-[#2b2621] hover:bg-[#eae5dc]";

        const btnAll = document.getElementById("btnAllPending");
        btnAll.className =
          currentView === "ALL_PENDING"
            ? "w-full text-left px-3 py-2 rounded text-sm font-semibold bg-[#3b2d24] text-white flex items-center justify-between"
            : "w-full text-left px-3 py-2 rounded text-sm font-medium text-[#2b2621] hover:bg-[#eae5dc] flex items-center justify-between";

        const btnHist = document.getElementById("btnAllHistory");
        btnHist.className =
          currentView === "ALL_HISTORY"
            ? "w-full text-left px-3 py-2 rounded text-sm font-semibold bg-[#3b2d24] text-white"
            : "w-full text-left px-3 py-2 rounded text-sm font-medium text-[#2b2621] hover:bg-[#eae5dc]";

        getClientOrder().forEach((cName) => {
          const client = state.clients[cName];
          const clientHasSubs = hasSubfolders(client);
          const consolidated = getConsolidatedClientData(client);
          const clientPending = consolidated.events.filter((e) => isPendingStatus(e.status)).length;

          const wrapper = document.createElement("div");
          wrapper.className = "rounded border border-[#e3decb] bg-white overflow-hidden mb-1";
          wrapper.draggable = true;
          wrapper.ondragstart = (e) => onDragStartClient(e, cName);
          wrapper.ondragover = (e) => onDragOverClient(e);
          wrapper.ondrop = (e) => onDropClient(e, cName);

          if (!clientHasSubs) {
            const isSelected = currentView === "CLIENT" && activeClient === cName;
            const btn = document.createElement("button");
            btn.onclick = () => openClient(cName, null);
            btn.className = `w-full text-left px-3 py-2 text-sm flex items-center justify-between transition ${
              isSelected
                ? "bg-[#3b2d24] text-white font-semibold"
                : "text-[#2b2621] hover:bg-[#eae5dc] font-medium"
            }`;
            btn.innerHTML = `
            <span class="truncate pr-2">${client.name}</span>
            ${clientPending > 0 ? `<span class="text-xs px-1.5 py-0.5 rounded font-semibold ${isSelected ? "bg-amber-400 text-zinc-950" : "bg-amber-100 text-amber-800 border border-amber-300"}">${clientPending}</span>` : ""}
          `;
            wrapper.appendChild(btn);
          } else {
            const isExpanded = !!expandedClients[cName];
            const headerBtn = document.createElement("button");

            headerBtn.onclick = () => {
              if (expandedClients[cName]) {
                // Se já estiver expandido, apenas recolhe a pasta na barra lateral
                expandedClients[cName] = false;
                renderSidebar();
              } else {
                // Se estiver recolhido, expande a pasta e abre a página Geral
                openClient(cName, "GERAL");
              }
            };

            headerBtn.className =
              "w-full text-left px-3 py-2 text-sm font-semibold text-[#2b2621] hover:bg-[#eae5dc] flex items-center justify-between transition";
            headerBtn.innerHTML = `
            <div class="flex items-center gap-1.5 truncate pr-2">
              <span class="text-xs text-[#6b6155]">${isExpanded ? "▾" : "▸"}</span>
              <span class="truncate">${client.name}</span>
            </div>
            ${clientPending > 0 ? `<span class="text-xs bg-amber-100 text-amber-800 border border-amber-300 font-semibold px-1.5 py-0.5 rounded">${clientPending}</span>` : ""}
          `;
            wrapper.appendChild(headerBtn);

            if (isExpanded) {
              const subList = document.createElement("div");
              subList.className = "border-t border-[#e3decb] bg-[#faf8f5] py-1 px-1.5 space-y-0.5";

              const isGeralSelected =
                currentView === "CLIENT" && activeClient === cName && activeSubfolder === "GERAL";
              const geralBtn = document.createElement("button");
              geralBtn.onclick = () => openClient(cName, "GERAL");
              geralBtn.className = `w-full text-left pl-5 pr-2 py-1.5 rounded text-xs flex items-center justify-between transition ${
                isGeralSelected
                  ? "bg-[#3b2d24] text-white font-semibold"
                  : "text-[#4a4038] hover:bg-[#eae5dc] font-medium"
              }`;
              geralBtn.innerHTML = `
              <span class="truncate">📁 Geral</span>
${clientPending > 0 ? `<span class="text-[11px] opacity-80">${clientPending}</span>` : ""}            `;
              subList.appendChild(geralBtn);

              Object.keys(client.subfolders).forEach((sfName) => {
                const sf = client.subfolders[sfName];
                const sfPending = (sf.events || []).filter((e) => isPendingStatus(e.status)).length;
                const isSfSelected =
                  currentView === "CLIENT" && activeClient === cName && activeSubfolder === sfName;

                const sfBtn = document.createElement("button");
                sfBtn.onclick = () => openClient(cName, sfName);
                sfBtn.className = `w-full text-left pl-5 pr-2 py-1.5 rounded text-xs flex items-center justify-between transition ${
                  isSfSelected
                    ? "bg-[#3b2d24] text-white font-semibold"
                    : "text-[#4a4038] hover:bg-[#eae5dc]"
                }`;
                sfBtn.innerHTML = `
               <span class="truncate">${sf.status === "COMPLETO" ? "✅" : "📁"} ${sf.name}</span>
${sfPending > 0 ? `<span class="text-[11px] opacity-80">${sfPending}</span>` : ""}              `;
                subList.appendChild(sfBtn);
              });

              wrapper.appendChild(subList);
            }
          }

          tree.appendChild(wrapper);
        });
      }

      function selectView(view) {
        currentView = view;
        renderSidebar();
        renderMain();
      }

      function openClient(cName, subfolderName) {
        const client = state.clients[cName];
        if (!client) return;
        currentView = "CLIENT";
        activeClient = cName;
        showNewSubfolderInput = false;

        if (hasSubfolders(client)) {
          expandedClients[cName] = true;
          activeSubfolder = subfolderName || "GERAL";
        } else {
          activeSubfolder = null;
        }

        renderSidebar();
        renderMain();
      }

      function renderMain() {
        const main = document.getElementById("mainContent");
        if (currentView === "HOME") {
          renderHome(main);
        } else if (currentView === "ALL_PENDING") {
          renderAllPending(main);
        } else if (currentView === "ALL_HISTORY") {
          renderAllHistory(main);
        } else if (currentView === "CLIENT") {
          renderClientView(main);
        }
      }

      function renderHome(container) {
        const clientNames = Object.keys(state.clients).sort();
        const selectedCl =
          window.quickClient && state.clients[window.quickClient]
            ? window.quickClient
            : clientNames[0] || "";
        const clObj = selectedCl ? state.clients[selectedCl] : null;
        const subNames = clObj && hasSubfolders(clObj) ? Object.keys(clObj.subfolders) : [];
        const selectedSf =
          window.quickSubfolder && subNames.includes(window.quickSubfolder)
            ? window.quickSubfolder
            : "";

        container.innerHTML = `
        <div class="max-w-4xl mx-auto space-y-6 pb-12">

          <!-- TÍTULO E BOTÕES DE EXPORT/IMPORT -->
          <div class="bg-white border border-[#e3decb] p-4 rounded-lg shadow-sm flex items-center justify-between">
            <h1 class="text-lg font-bold text-[#2b2621] uppercase">REGISTRAR</h1>
            <div class="flex gap-2">
              <label title="Carregar arquivo JSON" class="cursor-pointer text-[10px] font-bold uppercase tracking-wider text-[#6b6155] bg-[#f8f6f0] hover:bg-[#e3decb] border border-[#d6cebc] px-2 py-1.5 rounded transition flex items-center gap-1">
              Importar
                <input type="file" accept=".json" class="hidden" onchange="importData(event)" />
              </label>
              <button onclick="exportData()" title="Salvar arquivo JSON no computador" class="text-[10px] font-bold uppercase tracking-wider text-[#6b6155] bg-[#f8f6f0] hover:bg-[#e3decb] border border-[#d6cebc] px-2 py-1.5 rounded transition flex items-center gap-1">
                Salvar dados no pc
              </button>
            </div>
          </div>

          <!-- BLOCO DE AÇÕES RÁPIDAS -->
          <div class="bg-white border border-[#e3decb] rounded-lg overflow-hidden shadow-sm">
            <div class="grid grid-cols-2 sm:grid-cols-4 border-b border-[#e3decb] bg-[#f4f0e6]">
              <button onclick="setHomeTab('TAREFA')" class="py-3 px-3 text-xs font-semibold uppercase tracking-wide border-r border-[#e3decb] transition ${homeTab === "TAREFA" ? "bg-[#3b2d24] text-white" : "text-[#4a4038] hover:bg-[#eae5dc]"}">
                A fazer
              </button>
              <button onclick="setHomeTab('HISTORICO')" class="py-3 px-3 text-xs font-semibold uppercase tracking-wide border-r border-[#e3decb] transition ${homeTab === "HISTORICO" ? "bg-[#3b2d24] text-white" : "text-[#4a4038] hover:bg-[#eae5dc]"}">
                Histórico
              </button>
              <button onclick="setHomeTab('ARQUIVO')" class="py-3 px-3 text-xs font-semibold uppercase tracking-wide border-r border-[#e3decb] transition ${homeTab === "ARQUIVO" ? "bg-[#3b2d24] text-white" : "text-[#4a4038] hover:bg-[#eae5dc]"}">
                Arquivos
              </button>
              <button onclick="setHomeTab('CLIENTE')" class="py-3 px-3 text-xs font-semibold uppercase tracking-wide transition ${homeTab === "CLIENTE" ? "bg-[#3b2d24] text-white" : "text-[#4a4038] hover:bg-[#eae5dc]"}">
                Novo Cliente
              </button>
            </div>

            <div class="p-5">
              ${homeTab === "CLIENTE" ? renderHomeNewClientTab() : renderHomeQuickEntryTab(clientNames, selectedCl, subNames, selectedSf)}
            </div>
          </div>

        </div>
      `;
      }

      function renderHomeQuickEntryTab(clientNames, selectedCl, subNames, selectedSf) {
        return `
        <form onsubmit="submitQuickHomeForm(event)" class="space-y-4">
          <div class="grid grid-cols-1 ${subNames.length > 0 ? "sm:grid-cols-2" : ""} gap-3">
            <div>
              <label class="block text-xs font-semibold text-[#6b6155] mb-1">Cliente</label>
              <select id="qhClient" onchange="window.quickClient=this.value; window.quickSubfolder=''; renderMain();"
                class="w-full bg-white text-sm text-[#2b2621] px-3 py-2 rounded border border-[#d6cebc] focus:outline-none focus:border-[#3b2d24]">
                ${clientNames.map((c) => `<option value="${c}" ${c === selectedCl ? "selected" : ""}>${c}</option>`).join("")}
              </select>
            </div>

            ${
              subNames.length > 0
                ? `
              <div>
                <label class="block text-xs font-semibold text-[#6b6155] mb-1">Pasta</label>
                <select id="qhSubfolder" onchange="window.quickSubfolder=this.value;"
                  class="w-full bg-white text-sm text-[#2b2621] px-3 py-2 rounded border border-[#d6cebc] focus:outline-none focus:border-[#3b2d24]">
                  <option value="" ${selectedSf === "" ? "selected" : ""}>📁 Geral (Cliente)</option>
                  ${subNames.map((sf) => `<option value="${sf}">${sf}</option>`).join("")}
                </select>
              </div>
            `
                : ""
            }
          </div>

          ${
            homeTab === "TAREFA"
              ? `
            <div class="grid grid-cols-1 sm:grid-cols-4 gap-3">
              <div class="sm:col-span-2">
                <label class="block text-xs font-semibold text-[#6b6155] mb-1">Descrição</label>
                <input type="text" id="qhText" placeholder="Digite a tarefa..."
                  class="w-full bg-white text-sm text-[#2b2621] px-3 py-2 rounded border border-[#d6cebc] focus:outline-none focus:border-[#3b2d24]" required />
              </div>
              <div>
                <label class="block text-xs font-semibold text-[#6b6155] mb-1">Status</label>
                <select id="qhStatus" class="w-full bg-white text-sm text-[#2b2621] px-3 py-2 rounded border border-[#d6cebc]">
                  <option value="A FAZER">A FAZER</option>
                  <option value="EM ESPERA">EM ESPERA</option>
                  <option value="EM ANDAMENTO">EM ANDAMENTO</option>
                </select>
              </div>
              <div>
                <label class="block text-xs font-semibold text-[#6b6155] mb-1">Prazo</label>
                <input type="date" id="qhDeadline" class="w-full bg-white text-sm text-[#2b2621] px-3 py-2 rounded border border-[#d6cebc]" />
              </div>
            </div>
          `
              : ""
          }

          ${
            homeTab === "HISTORICO"
              ? `
            <div>
              <label class="block text-xs font-semibold text-[#6b6155] mb-1">Registro (${todayBR()})</label>
              <textarea id="qhText" rows="2" placeholder="Digite o andamento..."

      function submitQuickHomeForm(e) {
        e.preventDefault();
        const cName = document.getElementById("qhClient").value;
        const sfSelect = document.getElementById("qhSubfolder");
        const sfName = sfSelect ? sfSelect.value : "";
        const client = state.clients[cName];
        if (!client) return;

        const target = sfName && client.subfolders[sfName] ? client.subfolders[sfName] : client;

        if (homeTab === "TAREFA") {
          const text = document.getElementById("qhText").value.trim();
          const status = document.getElementById("qhStatus").value;
          if (!text) return;
          const deadline = document.getElementById("qhDeadline").value || undefined;
          target.events.push({ id: "ev_" + Date.now(), date: todayBR(), text, status, deadline });
        } else if (homeTab === "HISTORICO") {
          const text = document.getElementById("qhText").value.trim();
          if (!text) return;
          target.events.push({ id: "ev_" + Date.now(), date: todayBR(), text, status: "COMPLETO" });
        } else if (homeTab === "ARQUIVO") {
          const title = document.getElementById("qhFileTitle").value.trim();
          const url = document.getElementById("qhFileUrl").value.trim();
          if (!title || !url) return;
          target.files.push({ title, url });
        }

        saveState();
        renderMain();
        const fb = document.getElementById("quickFeedback");
        if (fb) {
          fb.textContent = "Salvo.";
          setTimeout(() => {
            if (document.getElementById("quickFeedback"))
              document.getElementById("quickFeedback").textContent = "";
          }, 2500);
        }
      }

      function createNewClientFromHome(e) {
        e.preventDefault();
        const cName = document.getElementById("ncName").value.trim();
        if (!cName) return;

        if (!state.clients[cName]) {
          state.clients[cName] = {
            name: cName,
            objective: "",
            summary: "",
            files: [],
            events: [],
            subfolders: {}

        saveState();
        openClient(cName, null);

                </div>
              </div>
            `
              )
              .join("")}
          </div>
        </div>
      `;

        return `
        <div class="bg-white border border-[#e3decb] p-5 rounded-lg space-y-5 shadow-sm">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <h2 class="text-xs font-bold uppercase tracking-wider text-[#3b2d24]">FINANÇAS</h2>
            <span class="text-sm font-bold ${saldo < 0 ? "text-[#9b2c2c]" : "text-[#065f46]"}">Saldo: ${money(saldo)}</span>
          </div>
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            ${column("receitas", "Receitas", fin.receitas)}
            ${column("gastos", "Gastos", fin.gastos)}
          </div>
        </div>
      `;
      }

      function renderAllPending(container) {
        const pendingItems = [];
        Object.keys(state.clients)
          .sort()
          .forEach((cName) => {
            const cl = state.clients[cName];
            const consolidated = getConsolidatedClientData(cl);
            consolidated.events.forEach((ev) => {
              if (isPendingStatus(ev.status)) {
                pendingItems.push({ client: cName, origin: ev._origin, ...ev });
              }
            });
          });

        container.innerHTML = `
        <div class="max-w-4xl mx-auto space-y-4 pb-16">
          <div class="bg-white border border-[#e3decb] p-4 rounded-lg flex items-center justify-between shadow-sm">
            <h1 class="text-lg font-bold text-[#2b2621]">A fazer (${pendingItems.length})</h1>
          </div>

          <div class="space-y-2">
            ${sortByDeadline(pendingItems)
              .map(
                (item) => `
              <div class="bg-white border border-[#e3decb] p-3.5 rounded-lg flex flex-wrap sm:flex-nowrap items-center justify-between gap-3 shadow-sm">
                <div class="space-y-1 flex-1">
                  <div class="flex flex-wrap items-center gap-2">
                    <button onclick="openClient('${item.client}', ${item.origin ? `'${item.origin}'` : hasSubfolders(state.clients[item.client]) ? "'GERAL'" : "null"})"
                      class="text-sm font-bold text-[#2b2621] hover:underline">
                      ${item.client}${item.origin ? ` / 📁 ${item.origin}` : ""}
                    </button>
                    <span class="text-xs text-[#6b6155]">${item.date}</span>
                    <span class="text-[11px] px-2 py-0.5 rounded border font-semibold ${statusBadgeStyle(item.status)}">${item.status}</span>
                    ${deadlineInput(item.client, item)}
                  </div>
                  <p class="text-sm text-[#2b2621] whitespace-pre-line">${item.text}</p>
                </div>
                <button onclick="markCompleteGlobal('${item.client}', '${item.origin || ""}', '${item.id}')"
                  class="bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-medium px-3 py-1.5 rounded transition shrink-0">
                  Concluir
                </button>
              </div>
            `
              )
              .join("")}
          </div>
        </div>
      `;
      }

      function renderAllHistory(container) {
        const allHistory = [];
        Object.keys(state.clients)
          .sort()
          .forEach((cName) => {
            getConsolidatedClientData(state.clients[cName]).events.forEach((ev, i) => {
              if (isPendingStatus(ev.status)) return;
              allHistory.push({
                client: cName,
                origin: ev._origin,
                key: dmyKey(doneDate(ev)),
                i,
                ...ev
              });
            });
          });
        allHistory.sort((a, b) => b.key.localeCompare(a.key) || b.i - a.i);

        container.innerHTML = `
        <div class="max-w-4xl mx-auto space-y-4 pb-16">
          <div class="bg-white border border-[#e3decb] p-4 rounded-lg shadow-sm">
            <h1 class="text-lg font-bold text-[#2b2621]">Histórico Geral (${allHistory.length})</h1>
          </div>

          <div class="space-y-2">
            ${allHistory
              .map(
                (item) => `
              <div class="bg-[#faf8f5] border border-[#e3decb] p-3 rounded space-y-0.5">
                <div class="flex flex-wrap items-center gap-2">
                  <button onclick="openClient('${item.client}', ${item.origin ? `'${item.origin}'` : hasSubfolders(state.clients[item.client]) ? "'GERAL'" : "null"})"
                    class="text-sm font-bold text-[#2b2621] hover:underline">
                    ${item.client}${item.origin ? ` / 📁 ${item.origin}` : ""}
                  </button>
                  <span class="text-xs font-semibold text-[#6b6155]">${doneLabel(item)}</span>
                  <span class="text-[11px] px-2 py-0.5 rounded border font-semibold ${statusBadgeStyle(item.status)}">${item.status}</span>
                </div>
                <p class="text-sm text-[#2b2621] whitespace-pre-line">${item.text}</p>
              </div>
            `
              )
              .join("")}
          </div>
        </div>
      `;
      }

      function toggleNewSubfolderInput() {
        showNewSubfolderInput = !showNewSubfolderInput;
        renderMain();
        if (showNewSubfolderInput) {
          const inp = document.getElementById("newSubfolderName");
          if (inp) inp.focus();
        }
      }

      function createSubfolderInClient(e) {
        e.preventDefault();
        const name = document.getElementById("newSubfolderName").value.trim();
        if (!name) return;
        const client = state.clients[activeClient];
        client.subfolders = client.subfolders || {};
        if (!client.subfolders[name]) {
          client.subfolders[name] = {
            name,
            objective: "",
            summary: "",
            files: [],
            events: []
          };
        }
        showNewSubfolderInput = false;
        expandedClients[activeClient] = true;
        activeSubfolder = name;
        saveState();
        renderMain();
      }

      function getTargetContainer(clientName, originSubfolder) {
        const cl = state.clients[clientName];
        if (!cl) return null;
        if (originSubfolder && cl.subfolders && cl.subfolders[originSubfolder]) {
          return cl.subfolders[originSubfolder];
        }
        return cl;
      }

      function updateTargetField(field, val) {
        const cl = state.clients[activeClient];
        const target =
          activeSubfolder && activeSubfolder !== "GERAL" ? cl.subfolders[activeSubfolder] : cl;
        target[field] = val;
        saveState();
      }

      function addTaskInView(e) {
        e.preventDefault();
        const text = document.getElementById("newTaskText").value.trim();
        const status = document.getElementById("newTaskStatus").value;
        const originSelect = document.getElementById("newTaskOrigin");
        const origin = originSelect
          ? originSelect.value
          : activeSubfolder !== "GERAL"
            ? activeSubfolder
            : "";
        if (!text) return;

        const target = getTargetContainer(activeClient, origin);
        const deadline = document.getElementById("newTaskDeadline").value || undefined;
        target.events.push({ id: "ev_" + Date.now(), date: todayBR(), text, status, deadline });
        saveState();
        renderMain();
      }

      function addHistoryInView(e) {
        e.preventDefault();
        const text = document.getElementById("newHistoryText").value.trim();
        const originSelect = document.getElementById("newHistoryOrigin");
        const origin = originSelect
          ? originSelect.value
          : activeSubfolder !== "GERAL"
            ? activeSubfolder
            : "";
        if (!text) return;

        const target = getTargetContainer(activeClient, origin);
        target.events.push({ id: "ev_" + Date.now(), date: todayBR(), text, status: "COMPLETO" });
        saveState();
        renderMain();
      }

      function changeEventStatus(originSubfolder, eventId, newStatus) {
        const target = getTargetContainer(activeClient, originSubfolder);
        const ev = target.events.find((e) => e.id === eventId);
        if (ev) {
          ev.status = newStatus;
          saveState();
          renderMain();
        }
      }

      function completeEvent(cName, originSubfolder, eventId) {
        const ev = getTargetContainer(cName, originSubfolder).events.find((e) => e.id === eventId);
        ev.status = "COMPLETO";
        ev.doneDate = todayBR();
        saveState();
        renderMain();
      }

      function markComplete(originSubfolder, eventId) {
        completeEvent(activeClient, originSubfolder, eventId);
      }

      function markCompleteGlobal(cName, originSubfolder, eventId) {
        completeEvent(cName, originSubfolder, eventId);
      }

      function setDeadline(cName, originSubfolder, eventId, value) {
        const ev = getTargetContainer(cName, originSubfolder).events.find((e) => e.id === eventId);
        if (value) ev.deadline = value;
        else delete ev.deadline;
        saveState();
        renderMain();
      }

      function addFinance(type, e) {
        e.preventDefault();
        const cl = state.clients[activeClient];
        if (!cl.finance) cl.finance = { gastos: [], receitas: [] };
        const f = e.target.elements;
        cl.finance[type].push({
          id: "fin_" + Date.now(),
          desc: f.desc.value.trim(),
          value: Number(f.value.value),
          date: f.date.value
        });
        saveState();
        renderMain();
      }

      function deleteFinance(type, id) {
        const cl = state.clients[activeClient];
        cl.finance[type] = cl.finance[type].filter((i) => i.id !== id);
        saveState();
        renderMain();
      }

      function deleteEvent(originSubfolder, eventId) {
        const target = getTargetContainer(activeClient, originSubfolder);
        target.events = target.events.filter((e) => e.id !== eventId);
        saveState();
        renderMain();
      }

      function addFileInView(e) {
        e.preventDefault();
        const title =
          document.getElementById("fileTitle").value.txt ||
          document.getElementById("fileTitle").value.trim();
        const url = document.getElementById("fileUrl").value.trim();
        const originSelect = document.getElementById("newFileOrigin");
        const origin = originSelect
          ? originSelect.value
          : activeSubfolder !== "GERAL"
            ? activeSubfolder
            : "";
        if (!title || !url) return;

        const target = getTargetContainer(activeClient, origin);
        target.files.push({ title, url });
        saveState();
        renderMain();
      }

      function removeFile(originSubfolder, idx) {
        const target = getTargetContainer(activeClient, originSubfolder);
        target.files.splice(idx, 1);
        saveState();
        renderMain();
      }

      function renameClient(oldName) {
        const newName = prompt("Novo nome do cliente:", oldName);
        if (!newName || newName.trim() === "" || newName === oldName) return;
        if (state.clients[newName]) return alert("Já existe um cliente com este nome.");

        // Atualiza os dados do cliente
        state.clients[newName] = state.clients[oldName];
        state.clients[newName].name = newName;
        delete state.clients[oldName];

        // Atualiza a ordem (caso use Drag and Drop)
        if (state.clientOrder) {
          const idx = state.clientOrder.indexOf(oldName);
          if (idx !== -1) state.clientOrder[idx] = newName;
        }

        // Atualiza variáveis de interface
        if (activeClient === oldName) activeClient = newName;
        if (expandedClients[oldName]) {
          expandedClients[newName] = true;
          delete expandedClients[oldName];
        }

        saveState();
        renderSidebar();
        renderMain();
      }

      function renameSubfolder(cName, oldSfName) {
        const newName = prompt("Novo nome da subpasta:", oldSfName);
        if (!newName || newName.trim() === "" || newName === oldSfName) return;
        if (newName.toUpperCase() === "GERAL") return alert("Este nome é reservado.");
        if (state.clients[cName].subfolders[newName])
          return alert("Já existe uma subpasta com este nome.");

        state.clients[cName].subfolders[newName] = state.clients[cName].subfolders[oldSfName];
        state.clients[cName].subfolders[newName].name = newName;
        delete state.clients[cName].subfolders[oldSfName];

        if (activeSubfolder === oldSfName) activeSubfolder = newName;

        saveState();
        renderSidebar();
        renderMain();
      }

      function editClientNameInline() {
        const span = document.getElementById("clientNameSpan");
        const btn = document.getElementById("clientNameEditBtn");
        const oldName = span.innerText.trim();

        span.contentEditable = "true";
        span.focus();

        // Seleciona todo o texto automaticamente
        const selection = window.getSelection();
        const range = document.createRange();
        range.selectNodeContents(span);
        selection.removeAllRanges();
        selection.addRange(range);

        btn.style.display = "none"; // Esconde o lápis enquanto digita

        span.onkeydown = function (e) {
          if (e.key === "Enter") {
            e.preventDefault();
            span.blur(); // Salva ao apertar Enter
          }
        };

        span.onblur = function () {
          span.contentEditable = "false";
          btn.style.display = "inline-block";
          const newName = span.innerText.trim();

          if (!newName || newName === oldName) {
            span.innerText = oldName;
            return;
          }
          if (state.clients[newName]) {
            alert("Já existe um cliente com este nome.");
            span.innerText = oldName;
            return;
          }

          // Lógica de salvar
          state.clients[newName] = state.clients[oldName];
          state.clients[newName].name = newName;
          delete state.clients[oldName];

          if (state.clientOrder) {
            const idx = state.clientOrder.indexOf(oldName);
            if (idx !== -1) state.clientOrder[idx] = newName;
          }

          if (activeClient === oldName) activeClient = newName;
          if (expandedClients[oldName]) {
            expandedClients[newName] = true;
            delete expandedClients[oldName];
          }

          saveState();
          renderSidebar();
          renderMain();
        };
      }

      function editSubfolderNameInline() {
        const span = document.getElementById("subfolderNameSpan");
        const btn = document.getElementById("subfolderNameEditBtn");
        const oldName = span.innerText.trim();
        const cName = activeClient;

        span.contentEditable = "true";
        span.focus();

        const selection = window.getSelection();
        const range = document.createRange();
        range.selectNodeContents(span);
        selection.removeAllRanges();
        selection.addRange(range);

        btn.style.display = "none";

        span.onkeydown = function (e) {
          if (e.key === "Enter") {
            e.preventDefault();
            span.blur();
          }
        };

        span.onblur = function () {
          span.contentEditable = "false";
          btn.style.display = "inline-block";
          const newName = span.innerText.trim();

          if (!newName || newName === oldName) {
            span.innerText = oldName;
            return;
          }
          if (newName.toUpperCase() === "GERAL") {
            alert("Este nome é reservado.");
            span.innerText = oldName;
            return;
          }
          if (state.clients[cName].subfolders[newName]) {
            alert("Já existe uma subpasta com este nome.");
            span.innerText = oldName;
            return;
          }

          state.clients[cName].subfolders[newName] = state.clients[cName].subfolders[oldName];
          state.clients[cName].subfolders[newName].name = newName;
          delete state.clients[cName].subfolders[oldName];

          if (activeSubfolder === oldName) activeSubfolder = newName;

          saveState();
          renderSidebar();
          renderMain();
        };
      }

      // ADD THIS JUST BEFORE renderSidebar(); renderMain();

      function setupVoiceTyping() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          if (document.getElementById("globalMicBtn"))
            document.getElementById("globalMicBtn").style.display = "none";
          return;
        }

        const recognition = new SpeechRecognition();
        recognition.lang = "pt-BR";
        recognition.interimResults = false;
        recognition.continuous = true; // 1. Set to continuous listening

        const micBtn = document.getElementById("globalMicBtn");
        let isListening = false;
        let lastFocusedInput = null;
        let manualStop = false; // Tracker to distinguish manual click from browser timeout

        document.addEventListener("focusin", (e) => {
          if (
            e.target.tagName === "INPUT" ||
            e.target.tagName === "TEXTAREA" ||
            e.target.isContentEditable
          ) {
            lastFocusedInput = e.target;
          }
        });

        micBtn.addEventListener("click", (e) => {
          e.preventDefault();

          if (!lastFocusedInput) {
            alert("Por favor, clique dentro de um campo de texto primeiro para começar a ditar.");
            return;
          }

          if (isListening) {
            manualStop = true; // User explicitly clicked to stop
            recognition.stop();
            return;
          }

          manualStop = false;
          lastFocusedInput.focus();
          recognition.start();
        });

        recognition.onstart = () => {
          isListening = true;
          micBtn.classList.remove("bg-[#3b2d24]", "hover:bg-[#4f3d32]");
          micBtn.classList.add("bg-red-600", "animate-pulse");
        };

        recognition.onresult = (event) => {
          // 2. Grab only the latest phrase recognized, not the whole session
          const current = event.resultIndex;
          const transcript = event.results[current][0].transcript;
          const activeEl = lastFocusedInput;

          if (activeEl) {
            if (activeEl.isContentEditable) {
              activeEl.innerText = (activeEl.innerText + " " + transcript).trim();
            } else if (activeEl.tagName === "INPUT" || activeEl.tagName === "TEXTAREA") {
              if (activeEl.value.length > 0 && !activeEl.value.endsWith(" ")) {
                activeEl.value += " " + transcript;
              } else {
                activeEl.value += transcript;
              }
            }

            activeEl.dispatchEvent(new Event("input", { bubbles: true }));
            activeEl.dispatchEvent(new Event("change", { bubbles: true }));
          }
        };

        recognition.onend = () => {
          // 3. If the browser timed out but the user didn't click stop, auto-restart
          if (!manualStop) {
            recognition.start();
          } else {
            isListening = false;
            micBtn.classList.add("bg-[#3b2d24]", "hover:bg-[#4f3d32]");
            micBtn.classList.remove("bg-red-600", "animate-pulse");
          }
        };

        recognition.onerror = (event) => {
          if (event.error === "not-allowed") {
            manualStop = true; // Stop permanently if microphone access is denied
          }
        };
      }

      setupVoiceTyping();

      renderSidebar();
      renderMain();
    </script>
  </body>
</html>
